{% extends "base.html" %}
{% load static %}
{% block title %}Modifier une porte - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.pem>*+*{margin-top:1.5rem}
.pem-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.pem-card{padding:2rem}}
.pem-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.pem-grid{grid-template-columns:1fr 1fr}}
.pem-full{grid-column:1/-1}
.pem-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.pem-required{color:var(--secondary)}
.pem-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.pem-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.pem-textarea{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;resize:vertical;min-height:6rem;transition:border-color .15s,box-shadow .15s}
.pem-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.pem-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.pem-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.pem-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.pem-actions{flex-direction:row}}
.pem-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.pem-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.pem-btn-primary:hover{background:var(--primary-hover)}
.pem-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.pem-btn-ghost:hover{background:#f8fafc}
</style>
{% endblock %}

{% block content %}
<div class="pem">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Portes d'entrée</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Modifier la porte</h1>
  </div>

  <form class="pem-card" method="post" action="{% url 'modifier_porte_entree' porte.pk %}">
    {% csrf_token %}
    <div class="pem-grid">
      <div>
        <label class="pem-label">Nom de la porte <span class="pem-required">*</span></label>
        <input class="pem-input" type="text" name="titre" value="{{ porte.titre }}" required />
      </div>
      <div>
        <label class="pem-label">Emplacement physique</label>
        <input class="pem-input" type="text" name="emplacement" value="{{ porte.emplacement|default:'' }}" />
      </div>
      <div class="pem-full">
        <label class="pem-label">Description</label>
        <textarea class="pem-textarea" name="description" rows="4">{{ porte.description|default:'' }}</textarea>
      </div>
      <div>
        <label class="pem-label">Statut</label>
        <select class="pem-select" name="statut">
          <option value="ACTIF" {% if porte.statut == 'ACTIF' %}selected{% endif %}>ACTIF</option>
          <option value="INACTIF" {% if porte.statut == 'INACTIF' %}selected{% endif %}>INACTIF</option>
        </select>
      </div>
    </div>
    <div class="pem-actions">
      <a href="{% url 'liste_portes_entree' %}" class="pem-btn pem-btn-ghost">Annuler</a>
      <button type="submit" class="pem-btn pem-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
