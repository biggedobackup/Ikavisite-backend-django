{% extends "base.html" %}
{% load static %}
{% block title %}Ajouter un utilisateur - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.uta>*+*{margin-top:1.5rem}
.uta-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.uta-card{padding:2rem}}
.uta-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.uta-grid{grid-template-columns:1fr 1fr}}
.uta-full{grid-column:1/-1}
.uta-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.uta-required{color:var(--secondary)}
.uta-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.uta-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.uta-input::placeholder{color:#94a3b8;font-weight:500}
.uta-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.uta-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.uta-check{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-radius:.75rem;border:1px solid #e2e8f0;cursor:pointer;transition:border-color .15s}
.uta-check:hover{border-color:var(--primary)}
.uta-check input{width:1.125rem;height:1.125rem;accent-color:var(--primary)}
.uta-check label{font-size:.875rem;font-weight:600;color:#0f172a;cursor:pointer}
.uta-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.uta-actions{flex-direction:row}}
.uta-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.uta-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.uta-btn-primary:hover{background:var(--primary-hover)}
.uta-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.uta-btn-ghost:hover{background:#f8fafc}
.uta-section-title{font-size:1rem;font-weight:900;color:#0f172a;margin-bottom:.75rem;grid-column:1/-1;padding-top:.5rem;border-top:1px solid #f1f5f9}
</style>
{% endblock %}

{% block content %}
<div class="uta">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Utilisateurs</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Ajouter un utilisateur</h1>
  </div>

  <form class="uta-card" method="post" action="{% url 'ajouter_utilisateur' %}">
    {% csrf_token %}
    <div class="uta-grid">
      <div>
        <label class="uta-label">Nom d'utilisateur <span class="uta-required">*</span></label>
        <input class="uta-input" type="text" name="username" placeholder="jean.dupont" value="{{ request.POST.username|default:'' }}" required />
      </div>
      <div>
        <label class="uta-label">Email <span class="uta-required">*</span></label>
        <input class="uta-input" type="email" name="email" placeholder="email@ikavisite.bf" value="{{ request.POST.email|default:'' }}" required />
      </div>
      <div>
        <label class="uta-label">Prénom</label>
        <input class="uta-input" type="text" name="first_name" placeholder="Jean" value="{{ request.POST.first_name|default:'' }}" />
      </div>
      <div>
        <label class="uta-label">Nom</label>
        <input class="uta-input" type="text" name="last_name" placeholder="Dupont" value="{{ request.POST.last_name|default:'' }}" />
      </div>
      <div>
        <label class="uta-label">Téléphone mobile</label>
        <input class="uta-input" type="tel" name="telephone_mobile" placeholder="+226 70 00 00 00" value="{{ request.POST.telephone_mobile|default:'' }}" />
      </div>
      <div>
        <label class="uta-label">Point d'entrée</label>
        <select class="uta-select" name="porte_entree">
          <option value="">Aucun</option>
          {% for p in portes %}
          <option value="{{ p.pk }}" {% if request.POST.porte_entree|stringformat:'s' == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.titre }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="uta-label">Mot de passe <span class="uta-required">*</span></label>
        <input class="uta-input" type="password" name="password" placeholder="••••••••" required />
      </div>
      <div>
        <label class="uta-label">Statut</label>
        <select class="uta-select" name="statut">
          <option value="ACTIF" selected>ACTIF</option>
          <option value="INACTIF">INACTIF</option>
        </select>
      </div>
      <div>
        <label class="uta-label">Rôle (groupe) <span class="uta-required">*</span></label>
        <select class="uta-select" name="group">
          <option value="">Sélectionner un rôle</option>
          {% for g in groupes %}
          <option value="{{ g.pk }}" {% if request.POST.group|stringformat:'s' == g.pk|stringformat:'s' %}selected{% endif %}>{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="uta-actions">
      <a href="{% url 'liste_utilisateurs' %}" class="uta-btn uta-btn-ghost">Annuler</a>
      <button type="submit" class="uta-btn uta-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
