{% extends "base.html" %}
{% load static %}
{% block title %}Modifier un utilisateur - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.utm>*+*{margin-top:1.5rem}
.utm-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.utm-card{padding:2rem}}
.utm-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.utm-grid{grid-template-columns:1fr 1fr}}
.utm-full{grid-column:1/-1}
.utm-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.utm-required{color:var(--secondary)}
.utm-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.utm-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.utm-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.utm-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.utm-check{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-radius:.75rem;border:1px solid #e2e8f0;cursor:pointer;transition:border-color .15s}
.utm-check:hover{border-color:var(--primary)}
.utm-check input{width:1.125rem;height:1.125rem;accent-color:var(--primary)}
.utm-check label{font-size:.875rem;font-weight:600;color:#0f172a;cursor:pointer}
.utm-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.utm-actions{flex-direction:row}}
.utm-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.utm-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.utm-btn-primary:hover{background:var(--primary-hover)}
.utm-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.utm-btn-ghost:hover{background:#f8fafc}
.utm-section-title{font-size:1rem;font-weight:900;color:#0f172a;margin-bottom:.75rem;grid-column:1/-1;padding-top:.5rem;border-top:1px solid #f1f5f9}
</style>
{% endblock %}

{% block content %}
<div class="utm">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Utilisateurs</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Modifier un utilisateur</h1>
  </div>

  <form class="utm-card" method="post" action="{% url 'modifier_utilisateur' item.pk %}">
    {% csrf_token %}
    <div class="utm-grid">
      <div>
        <label class="utm-label">Nom d'utilisateur <span class="utm-required">*</span></label>
        <input class="utm-input" type="text" name="username" value="{{ item.username }}" required />
      </div>
      <div>
        <label class="utm-label">Email <span class="utm-required">*</span></label>
        <input class="utm-input" type="email" name="email" value="{{ item.email }}" required />
      </div>
      <div>
        <label class="utm-label">Prénom</label>
        <input class="utm-input" type="text" name="first_name" value="{{ item.first_name|default:'' }}" />
      </div>
      <div>
        <label class="utm-label">Nom</label>
        <input class="utm-input" type="text" name="last_name" value="{{ item.last_name|default:'' }}" />
      </div>
      <div>
        <label class="utm-label">Téléphone mobile</label>
        <input class="utm-input" type="tel" name="telephone_mobile" value="{{ item.telephone_mobile|default:'' }}" />
      </div>
      <div>
        <label class="utm-label">Point d'entrée</label>
        <select class="utm-select" name="porte_entree">
          <option value="">Aucun</option>
          {% for p in portes %}
          <option value="{{ p.pk }}" {% if item.porte_entree_id == p.pk %}selected{% endif %}>{{ p.titre }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="utm-label">Nouveau mot de passe (laisser vide pour conserver)</label>
        <input class="utm-input" type="password" name="new_password" placeholder="••••••••" />
      </div>
      <div>
        <label class="utm-label">Statut</label>
        <select class="utm-select" name="statut">
          <option value="ACTIF" {% if item.statut == 'ACTIF' %}selected{% endif %}>ACTIF</option>
          <option value="INACTIF" {% if item.statut == 'INACTIF' %}selected{% endif %}>INACTIF</option>
        </select>
      </div>
      <div>
        <label class="utm-label">Rôle (groupe) <span class="utm-required">*</span></label>
        <select class="utm-select" name="group">
          <option value="">Sélectionner un rôle</option>
          {% for g in groupes %}
          <option value="{{ g.pk }}" {% if g in item.groups.all %}selected{% endif %}>{{ g.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="utm-actions">
      <a href="{% url 'liste_utilisateurs' %}" class="utm-btn utm-btn-ghost">Annuler</a>
      <button type="submit" class="utm-btn utm-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
