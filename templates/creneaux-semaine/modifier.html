{% extends "base.html" %}
{% load static %}
{% block title %}Modifier un créneau - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.crm>*+*{margin-top:1.5rem}
.crm-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.crm-card{padding:2rem}}
.crm-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.crm-grid{grid-template-columns:1fr 1fr}}
.crm-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.crm-required{color:var(--secondary)}
.crm-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.crm-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.crm-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.crm-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.crm-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.crm-actions{flex-direction:row}}
.crm-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.crm-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.crm-btn-primary:hover{background:var(--primary-hover)}
.crm-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.crm-btn-ghost:hover{background:#f8fafc}
</style>
{% endblock %}

{% block content %}
<div class="crm">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Créneaux de semaine</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Modifier le créneau</h1>
  </div>

  <form class="crm-card" method="post" action="{% url 'modifier_creneau' item.pk %}">
    {% csrf_token %}
    <div class="crm-grid">
      <div>
        <label class="crm-label">Jour de la semaine <span class="crm-required">*</span></label>
        <select class="crm-select" name="jour_semaine" required>
          {% for j in jours %}
          <option value="{{ j }}" {% if item.jour_semaine == j %}selected{% endif %}>{{ j }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="crm-label">Statut</label>
        <select class="crm-select" name="statut">
          <option value="ACTIF" {% if item.statut == 'ACTIF' %}selected{% endif %}>ACTIF</option>
          <option value="INACTIF" {% if item.statut == 'INACTIF' %}selected{% endif %}>INACTIF</option>
        </select>
      </div>
      <div>
        <label class="crm-label">Heure de début <span class="crm-required">*</span></label>
        <input class="crm-input" type="time" name="heure_debut" value="{{ item.heure_debut }}" required />
      </div>
      <div>
        <label class="crm-label">Heure de fin <span class="crm-required">*</span></label>
        <input class="crm-input" type="time" name="heure_fin" value="{{ item.heure_fin }}" required />
      </div>
    </div>
    <div class="crm-actions">
      <a href="{% url 'liste_creneaux' %}" class="crm-btn crm-btn-ghost">Annuler</a>
      <button type="submit" class="crm-btn crm-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
