{% extends "base.html" %}{% load static %}{% block title %}Ajouter une inscription - IKAVISITE{% endblock %}
{% block extra_css %}
<style>.ln-la>*+*{margin-top:1.5rem}.ln-la h1{font-size:1.875rem;font-weight:900;color:#0f172a}.ln-la-sub{font-size:.875rem;font-weight:500;color:#64748b}.ln-la-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04)}@media(min-width:640px){.ln-la-card{padding:2rem}}.ln-la-grid{display:grid;gap:1.25rem}@media(min-width:640px){.ln-la-grid{grid-template-columns:1fr 1fr}}.ln-la-colspan{grid-column:1/-1}.ln-la-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}.ln-la-required{color:var(--secondary)}.ln-la-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s;box-sizing:border-box}.ln-la-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-la-input::placeholder{color:#94a3b8;font-weight:500}.ln-la-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem;box-sizing:border-box}.ln-la-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-la-textarea{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;resize:vertical;min-height:5rem;transition:border-color .15s;box-sizing:border-box}.ln-la-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-la-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}@media(min-width:640px){.ln-la-actions{flex-direction:row}}.ln-la-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s;text-decoration:none;text-align:center}.ln-la-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;cursor:pointer}.ln-la-btn-ghost:hover{background:#f8fafc}.ln-la-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}.ln-la-btn-primary:hover{background:var(--primary-hover)}</style>{% endblock %}
{% block content %}<div class="ln-la"><p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Listes noires</p><h1 style="margin-top:.5rem">Ajouter une inscription</h1>
<form class="ln-la-card" style="margin-top:2rem" method="post" action="{% url 'ajouter_liste_noire' %}">{% csrf_token %}<div class="ln-la-grid"><div><label class="ln-la-label">Type de pièce</label><select class="ln-la-select" name="piece_identite"><option value="">Sélectionner</option><option value="CNI" {% if request.POST.piece_identite == 'CNI' %}selected{% endif %}>CNI</option><option value="Passeport" {% if request.POST.piece_identite == 'Passeport' %}selected{% endif %}>Passeport</option><option value="Permis" {% if request.POST.piece_identite == 'Permis' %}selected{% endif %}>Permis</option><option value="Autre" {% if request.POST.piece_identite == 'Autre' %}selected{% endif %}>Autre</option></select></div><div><label class="ln-la-label">Nom <span class="ln-la-required">*</span></label><input class="ln-la-input" type="text" name="nom" value="{{ request.POST.nom|default:'' }}" placeholder="Dupont" required /></div><div><label class="ln-la-label">Prénom <span class="ln-la-required">*</span></label><input class="ln-la-input" type="text" name="prenom" value="{{ request.POST.prenom|default:'' }}" placeholder="Jean" required /></div><div><label class="ln-la-label">Numéro de pièce</label><input class="ln-la-input" type="text" name="numero_piece" value="{{ request.POST.numero_piece|default:'' }}" placeholder="AB123456" /></div><div><label class="ln-la-label">Numéro NIP</label><input class="ln-la-input" type="text" name="numero_nip" value="{{ request.POST.numero_nip|default:'' }}" placeholder="NIP" /></div><div class="ln-la-colspan"><label class="ln-la-label">Motif</label><textarea class="ln-la-textarea" rows="3" name="motif" placeholder="Description du motif d'inscription">{{ request.POST.motif|default:'' }}</textarea></div><div><label class="ln-la-label">Date de début</label><input class="ln-la-input" type="date" name="date_debut" value="{{ request.POST.date_debut|default:'' }}" /></div><div><label class="ln-la-label">Date de fin</label><input class="ln-la-input" type="date" name="date_fin" value="{{ request.POST.date_fin|default:'' }}" /></div></div><div class="ln-la-actions"><a href="{% url 'liste_listes_noires' %}" class="ln-la-btn-ghost">Annuler</a><button type="submit" class="ln-la-btn ln-la-btn-primary">Enregistrer</button></div></form></div>{% endblock %}
