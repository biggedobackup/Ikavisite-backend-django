{% extends "base.html" %}{% load static %}{% block title %}Modifier un type - IKAVISITE{% endblock %}
{% block extra_css %}
<style>.ln-tm>*+*{margin-top:1.5rem}.ln-tm h1{font-size:1.875rem;font-weight:900;color:#0f172a}.ln-tm-sub{font-size:.875rem;font-weight:500;color:#64748b}.ln-tm-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04)}@media(min-width:640px){.ln-tm-card{padding:2rem}}.ln-tm-grid{display:grid;gap:1.25rem}@media(min-width:640px){.ln-tm-grid{grid-template-columns:1fr 1fr}}.ln-tm-colspan{grid-column:1/-1}.ln-tm-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}.ln-tm-required{color:var(--secondary)}.ln-tm-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s;box-sizing:border-box}.ln-tm-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-tm-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem;box-sizing:border-box}.ln-tm-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-tm-textarea{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;resize:vertical;min-height:6rem;transition:border-color .15s;box-sizing:border-box}.ln-tm-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.ln-tm-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}@media(min-width:640px){.ln-tm-actions{flex-direction:row}}.ln-tm-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s;text-decoration:none;text-align:center}.ln-tm-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;cursor:pointer}.ln-tm-btn-ghost:hover{background:#f8fafc}.ln-tm-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}.ln-tm-btn-primary:hover{background:var(--primary-hover)}</style>{% endblock %}
{% block content %}<div class="ln-tm"><p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Types de liste noire</p><h1 style="margin-top:.5rem">Modifier un type de liste noire</h1>
<form class="ln-tm-card" style="margin-top:2rem" method="post" action="{% url 'modifier_type_liste_noire' item.pk %}">{% csrf_token %}<div class="ln-tm-grid"><div><label class="ln-tm-label">Nom <span class="ln-tm-required">*</span></label><input class="ln-tm-input" type="text" name="nom" value="{{ item.nom }}" required /></div><div><label class="ln-tm-label">Niveau de risque</label><select class="ln-tm-select" name="niveau_risque"><option value="FAIBLE" {% if item.niveau_risque == 'FAIBLE' %}selected{% endif %}>FAIBLE</option><option value="MOYEN" {% if item.niveau_risque == 'MOYEN' %}selected{% endif %}>MOYEN</option><option value="ÉLEVÉ" {% if item.niveau_risque == 'ÉLEVÉ' %}selected{% endif %}>ÉLEVÉ</option><option value="CRITIQUE" {% if item.niveau_risque == 'CRITIQUE' %}selected{% endif %}>CRITIQUE</option></select></div><div><label class="ln-tm-label">Statut</label><select class="ln-tm-select" name="statut"><option value="ACTIF" {% if item.statut == 'ACTIF' %}selected{% endif %}>ACTIF</option><option value="INACTIF" {% if item.statut == 'INACTIF' %}selected{% endif %}>INACTIF</option></select></div><div class="ln-tm-colspan"><label class="ln-tm-label">Description</label><textarea class="ln-tm-textarea" rows="4" name="description">{{ item.description|default:'' }}</textarea></div></div><div class="ln-tm-actions"><a href="{% url 'liste_types_liste_noire' %}" class="ln-tm-btn-ghost">Annuler</a><button type="submit" class="ln-tm-btn ln-tm-btn-primary">Mettre à jour</button></div></form></div>{% endblock %}
