{% extends "base.html" %}{% load static %}{% block title %}Modifier un type d'incident - IKAVISITE{% endblock %}
{% block extra_css %}
<style>.tit-frm>*+*{margin-top:1.5rem}.tit-frm h1{font-size:1.875rem;font-weight:900;color:#0f172a}.tit-frm-sub{font-size:.875rem;font-weight:500;color:#64748b}.tit-frm-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04)}@media(min-width:640px){.tit-frm-card{padding:2rem}}.tit-frm-grid{display:grid;gap:1.25rem}@media(min-width:640px){.tit-frm-grid{grid-template-columns:1fr 1fr}}.tit-frm-colspan{grid-column:1/-1}.tit-frm-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}.tit-frm-required{color:var(--secondary)}.tit-frm-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s;box-sizing:border-box}.tit-frm-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.tit-frm-input::placeholder{color:#94a3b8;font-weight:500}.tit-frm-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem;box-sizing:border-box}.tit-frm-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.tit-frm-textarea{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;resize:vertical;min-height:6rem;transition:border-color .15s;box-sizing:border-box}.tit-frm-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}.tit-frm-checkbox{display:flex;align-items:center;gap:.625rem;font-size:.875rem;font-weight:600;color:#0f172a;cursor:pointer}.tit-frm-checkbox input[type=checkbox]{width:1.125rem;height:1.125rem;border-radius:.375rem;border:1px solid #d1d5db;accent-color:var(--primary);cursor:pointer}.tit-frm-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}@media(min-width:640px){.tit-frm-actions{flex-direction:row}}.tit-frm-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:900;border:none;cursor:pointer;transition:background .15s;text-decoration:none;white-space:nowrap}.tit-frm-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}.tit-frm-btn-primary:hover{background:var(--primary-hover)}.tit-frm-btn-ghost{background:#fff;color:#64748b;border:1px solid #e2e8f0}.tit-frm-btn-ghost:hover{background:#f8fafc;color:#0f172a}
</style>{% endblock %}
{% block content %}<div class="tit-frm"><p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Types d'incident</p><h1 style="margin-top:.5rem">Modifier un type d'incident</h1>
<form class="tit-frm-card" style="margin-top:2rem" method="post" action="{% url 'modifier_type_incident' item.pk %}">{% csrf_token %}<div class="tit-frm-grid"><div><label class="tit-frm-label">Nom <span class="tit-frm-required">*</span></label><input class="tit-frm-input" type="text" name="nom" value="{{ item.nom }}" required /></div><div><label class="tit-frm-label">Gravité par défaut</label><select class="tit-frm-select" name="gravite_defaut">{% for val, label in gravite_choices %}<option value="{{ val }}" {% if item.gravite_defaut == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div><div><label class="tit-frm-checkbox"><input type="checkbox" name="actif" {% if item.actif %}checked{% endif %} /> Actif</label></div><div class="tit-frm-colspan"><label class="tit-frm-label">Description</label><textarea class="tit-frm-textarea" rows="4" name="description">{{ item.description|default:'' }}</textarea></div></div><div class="tit-frm-actions"><a href="{% url 'liste_types_incident' %}" class="tit-frm-btn tit-frm-btn-ghost">Annuler</a><button type="submit" class="tit-frm-btn tit-frm-btn-primary">Mettre à jour</button></div></form></div>{% endblock %}
