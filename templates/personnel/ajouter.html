{% extends "base.html" %}
{% load static %}
{% block title %}Ajouter un membre - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.persa>*+*{margin-top:1.5rem}
.persa-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.persa-card{padding:2rem}}
.persa-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.persa-grid{grid-template-columns:1fr 1fr}}
.persa-full{grid-column:1/-1}
.persa-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.persa-required{color:var(--secondary)}
.persa-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.persa-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.persa-input::placeholder{color:#94a3b8;font-weight:500}
.persa-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.persa-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.persa-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.persa-actions{flex-direction:row}}
.persa-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.persa-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.persa-btn-primary:hover{background:var(--primary-hover)}
.persa-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.persa-btn-ghost:hover{background:#f8fafc}
</style>
{% endblock %}

{% block content %}
<div class="persa">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Personnels</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Ajouter un membre du personnel</h1>
  </div>

  <form class="persa-card" method="post" action="{% url 'ajouter_personnel' %}">
    {% csrf_token %}
    <div class="persa-grid">
      <div>
        <label class="persa-label">Prénom <span class="persa-required">*</span></label>
        <input class="persa-input" type="text" name="prenom" placeholder="Prénom" value="{{ request.POST.prenom|default:'' }}" required />
      </div>
      <div>
        <label class="persa-label">Nom <span class="persa-required">*</span></label>
        <input class="persa-input" type="text" name="nom" placeholder="Nom" value="{{ request.POST.nom|default:'' }}" required />
      </div>
      <div>
        <label class="persa-label">Fonction</label>
        <input class="persa-input" type="text" name="fonction" placeholder="Responsable RH" value="{{ request.POST.fonction|default:'' }}" />
      </div>
      <div>
        <label class="persa-label">Département</label>
        <select class="persa-select" name="id_departement">
          <option value="">Aucun</option>
          {% for d in departements %}
          <option value="{{ d.pk }}" {% if request.POST.id_departement|stringformat:'s' == d.pk|stringformat:'s' %}selected{% endif %}>{{ d.nom }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="persa-label">Email</label>
        <input class="persa-input" type="email" name="email" placeholder="email@ikavisite.bf" value="{{ request.POST.email|default:'' }}" />
      </div>
      <div>
        <label class="persa-label">Téléphone</label>
        <input class="persa-input" type="tel" name="telephone" placeholder="+226 70 00 00 00" value="{{ request.POST.telephone|default:'' }}" />
      </div>
      <div>
        <label class="persa-label">Statut</label>
        <select class="persa-select" name="statut">
          <option value="ACTIF" selected>ACTIF</option>
          <option value="INACTIF">INACTIF</option>
        </select>
      </div>
    </div>
    <div class="persa-actions">
      <a href="{% url 'liste_personnel' %}" class="persa-btn persa-btn-ghost">Annuler</a>
      <button type="submit" class="persa-btn persa-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
