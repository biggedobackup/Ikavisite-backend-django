{% extends "base.html" %}
{% load static %}
{% block title %}Modifier un membre - IKAVISITE{% endblock %}
{% block extra_css %}
<style>
.persm>*+*{margin-top:1.5rem}
.persm-card{border-radius:1.5rem;border:1px solid #f1f5f9;background:#fff;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.04);margin-top:2rem}
@media(min-width:640px){.persm-card{padding:2rem}}
.persm-grid{display:grid;gap:1.25rem}
@media(min-width:640px){.persm-grid{grid-template-columns:1fr 1fr}}
.persm-label{font-size:.8125rem;font-weight:700;color:#6b7280;display:block;margin-bottom:.5rem}
.persm-required{color:var(--secondary)}
.persm-input{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;transition:border-color .15s,box-shadow .15s}
.persm-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.persm-select{width:100%;border-radius:.75rem;border:1px solid #e2e8f0;padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:#0f172a;outline:none;background:#fff;transition:border-color .15s,box-shadow .15s;appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='none' stroke='%2394a3b8' viewBox='0 0 24 24'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .75rem center;background-size:1.25rem;padding-right:2.5rem}
.persm-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px #e8f3fc}
.persm-actions{display:flex;flex-direction:column;gap:.75rem;justify-content:flex-end;margin-top:2rem}
@media(min-width:640px){.persm-actions{flex-direction:row}}
.persm-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.75rem 1.5rem;font-size:.875rem;font-weight:700;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;text-align:center}
.persm-btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 6px -1px rgba(18,112,184,.2)}
.persm-btn-primary:hover{background:var(--primary-hover)}
.persm-btn-ghost{background:#fff;color:#374151;border:1px solid #e2e8f0}
.persm-btn-ghost:hover{background:#f8fafc}
</style>
{% endblock %}

{% block content %}
<div class="persm">
  <div>
    <p style="font-size:.75rem;font-weight:900;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em">Personnels</p>
    <h1 style="font-size:1.875rem;font-weight:900;color:#0f172a;margin-top:.5rem">Modifier un membre du personnel</h1>
  </div>

  <form class="persm-card" method="post" action="{% url 'modifier_personnel' item.pk %}">
    {% csrf_token %}
    <div class="persm-grid">
      <div>
        <label class="persm-label">Prénom <span class="persm-required">*</span></label>
        <input class="persm-input" type="text" name="prenom" value="{{ item.prenom }}" required />
      </div>
      <div>
        <label class="persm-label">Nom <span class="persm-required">*</span></label>
        <input class="persm-input" type="text" name="nom" value="{{ item.nom }}" required />
      </div>
      <div>
        <label class="persm-label">Fonction</label>
        <input class="persm-input" type="text" name="fonction" value="{{ item.fonction|default:'' }}" />
      </div>
      <div>
        <label class="persm-label">Département</label>
        <select class="persm-select" name="id_departement">
          <option value="">Aucun</option>
          {% for d in departements %}
          <option value="{{ d.pk }}" {% if item.departement_id == d.pk %}selected{% endif %}>{{ d.nom }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="persm-label">Email</label>
        <input class="persm-input" type="email" name="email" value="{{ item.email|default:'' }}" />
      </div>
      <div>
        <label class="persm-label">Téléphone</label>
        <input class="persm-input" type="tel" name="telephone" value="{{ item.telephone|default:'' }}" />
      </div>
      <div>
        <label class="persm-label">Statut</label>
        <select class="persm-select" name="statut">
          <option value="ACTIF" {% if item.statut == 'ACTIF' %}selected{% endif %}>ACTIF</option>
          <option value="INACTIF" {% if item.statut == 'INACTIF' %}selected{% endif %}>INACTIF</option>
        </select>
      </div>
    </div>
    <div class="persm-actions">
      <a href="{% url 'liste_personnel' %}" class="persm-btn persm-btn-ghost">Annuler</a>
      <button type="submit" class="persm-btn persm-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
